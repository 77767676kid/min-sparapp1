```html
<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Sparapp</title>
</head>
<body>
  <h1>💰 Min Sparapp</h1>

  <h2>Sparat: <span id="saved">0</span> kr</h2>

  <input type="number" id="amount" placeholder="Skriv belopp">

  <button onclick="saveMoney()">Spara pengar</button>
  <button onclick="removeMoney()">Ta bort pengar</button>

  <script>
    let saved = Number(localStorage.getItem("savedMoney")) || 0;

    document.getElementById("saved").textContent = saved;

    function saveMoney() {
      const amount = Number(document.getElementById("amount").value);

      if (amount > 0) {
        saved += amount;
        localStorage.setItem("savedMoney", saved);
        document.getElementById("saved").textContent = saved;
        document.getElementById("amount").value = "";
      }
    }

    function removeMoney() {
      const amount = Number(document.getElementById("amount").value);

      if (amount > 0 && amount <= saved) {
        saved -= amount;
        localStorage.setItem("savedMoney", saved);
        document.getElementById("saved").textContent = saved;
        document.getElementById("amount").value = "";
      } else if (amount > saved) {
        alert("Du kan inte ta bort mer pengar än du har sparat!");
      }
    }
  </script>
</body>
</html>
