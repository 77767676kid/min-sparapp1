<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Sparapp</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: auto;
      padding: 20px;
      background: #f5f5f5;
    }

    h1, h2 {
      text-align: center;
    }

    .saldo {
      background: white;
      padding: 20px;
      border-radius: 15px;
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 6px 0;
      font-size: 16px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 13px;
      margin: 6px 0;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .spara {
      background: #4caf50;
      color: white;
    }

    .slosa {
      background: #f44336;
      color: white;
    }

    .historik {
      background: white;
      padding: 15px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .händelse {
      padding: 12px;
      margin: 8px 0;
      border-radius: 10px;
      background: #f0f0f0;
    }

    .sparade {
      border-left: 5px solid #4caf50;
    }

    .slösade {
      border-left: 5px solid #f44336;
    }

    .datum {
      font-size: 13px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>

<body>

  <h1>💰 Min Sparapp</h1>

  <div class="saldo">
    <h2>Sparat</h2>
    <h1><span id="saved">0</span> kr</h1>
  </div>

  <input
    type="number"
    id="amount"
    placeholder="Belopp i kronor"
    min="0"
  >

  <input
    type="text"
    id="description"
    placeholder="Vad sparade/slösade du på?"
  >

  <button class="spara" onclick="saveMoney()">
    🟢 Spara pengar
  </button>

  <button class="slosa" onclick="spendMoney()">
    🔴 Slösa pengar
  </button>

  <div class="historik">
    <h2>📜 Historik</h2>
    <div id="history"></div>
  </div>

  <script>
    let saved = Number(localStorage.getItem("savedMoney")) || 0;

    let history =
      JSON.parse(localStorage.getItem("moneyHistory")) || [];

    function updateDisplay() {
      document.getElementById("saved").textContent =
        saved.toFixed(2);

      showHistory();
    }

    function getInput() {
      const amount =
        Number(document.getElementById("amount").value);

      const description =
        document.getElementById("description").value.trim();

      return { amount, description };
    }

    function clearInputs() {
      document.getElementById("amount").value = "";
      document.getElementById("description").value = "";
    }

    function saveMoney() {
      const { amount, description } = getInput();

      if (amount <= 0) {
        alert("Skriv ett belopp som är större än 0.");
        return;
      }

      if (description === "") {
        alert("Skriv vad du sparade pengarna till.");
        return;
      }

      saved += amount;

      history.push({
        type: "Sparade",
        amount: amount,
        description: description,
        date: new Date().toLocaleString("sv-SE")
      });

      localStorage.setItem("savedMoney", saved);
      localStorage.setItem(
        "moneyHistory",
        JSON.stringify(history)
      );

      clearInputs();
      updateDisplay();
    }

    function spendMoney() {
      const { amount, description } = getInput();

      if (amount <= 0) {
        alert("Skriv ett belopp som är större än 0.");
        return;
      }

      if (description === "") {
        alert("Skriv vad du slösade pengarna på.");
        return;
      }

      if (amount > saved) {
        alert("Du har inte så mycket pengar sparade!");
        return;
      }

      saved -= amount;

      history.push({
        type: "Slösade",
        amount: amount,
        description: description,
        date: new Date().toLocaleString("sv-SE")
      });

      localStorage.setItem("savedMoney", saved);
      localStorage.setItem(
        "moneyHistory",
        JSON.stringify(history)
      );

      clearInputs();
      updateDisplay();
    }

    function showHistory() {
      const historyElement =
        document.getElementById("history");

      if (history.length === 0) {
        historyElement.innerHTML =
          "<p>Ingen historik ännu.</p>";
        return;
      }

      historyElement.innerHTML = "";

      history.slice().reverse().forEach(item => {
        const row = document.createElement("div");

        row.className =
          "händelse " +
          (item.type === "Sparade"
            ? "sparade"
            : "slösade");

        const sign =
          item.type === "Sparade" ? "+" : "-";

        const emoji =
          item.type === "Sparade" ? "🟢" : "🔴";

        row.innerHTML = `
          <strong>
            ${emoji} ${item.type} ${sign}${item.amount} kr
          </strong>
          <br>
          ${item.description}
          <div class="datum">
            📅 ${item.date}
          </div>
        `;

        historyElement.appendChild(row);
      });
    }

    updateDisplay();
  </script>

</body>
</html>
