<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Min Sparapp</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
      color: #17202a;
      min-height: 100vh;
    }

    .app {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 25px 18px 40px;
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header .icon {
      font-size: 48px;
    }

    .header h1 {
      margin: 5px 0;
      font-size: 30px;
    }

    .header p {
      margin: 5px 0;
      color: #6b7280;
    }

    .balance-card {
      background: linear-gradient(135deg, #1976d2, #42a5f5);
      color: white;
      border-radius: 24px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(25, 118, 210, 0.25);
      margin-bottom: 20px;
    }

    .balance-card p {
      margin: 0 0 8px;
      opacity: 0.9;
    }

    .balance {
      font-size: 42px;
      font-weight: bold;
    }

    .box {
      background: rgba(255, 255, 255, 0.95);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
    }

    .box h2 {
      margin-top: 0;
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 2px solid #e5e7eb;
      border-radius: 14px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #42a5f5;
    }

    .date-time {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    button {
      width: 100%;
      border: none;
      padding: 15px;
      border-radius: 14px;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .save {
      background: #22c55e;
    }

    .spend {
      background: #ef4444;
    }

    .history-item {
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 10px;
      background: #f8fafc;
      border-left: 5px solid;
    }

    .history-item.saved {
      border-left-color: #22c55e;
    }

    .history-item.spent {
      border-left-color: #ef4444;
    }

    .history-top {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-weight: bold;
    }

    .saved-text {
      color: #16a34a;
    }

    .spent-text {
      color: #dc2626;
    }

    .description {
      margin-top: 7px;
      color: #374151;
    }

    .date {
      margin-top: 7px;
      font-size: 13px;
      color: #6b7280;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      padding: 20px;
    }

    @media (max-width: 400px) {
      .buttons,
      .date-time {
        grid-template-columns: 1fr;
      }

      .balance {
        font-size: 36px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="icon">💰</div>
    <h1>Min Sparapp</h1>
    <p>Håll koll på dina pengar</p>
  </div>

  <div class="balance-card">
    <p>Mitt saldo</p>
    <div class="balance">
      <span id="saved">0.00</span> kr
    </div>
  </div>

  <div class="box">

    <h2>💸 Ny händelse</h2>

    <input
      type="number"
      id="amount"
      placeholder="Belopp (kr)"
      min="0"
      step="0.01"
    >

    <input
      type="text"
      id="description"
      placeholder="Vad sparade/slösade du på?"
    >

    <div class="date-time">

      <input
        type="date"
        id="date"
      >

      <input
        type="time"
        id="time"
      >

    </div>

    <div class="buttons">

      <button class="save" onclick="saveMoney()">
        🟢 Spara
      </button>

      <button class="spend" onclick="spendMoney()">
        🔴 Slösa
      </button>

    </div>

  </div>

  <div class="box">

    <h2>📜 Historik</h2>

    <div id="history"></div>

  </div>

</div>


<script>

  let saved =
    Number(localStorage.getItem("savedMoney")) || 0;

  let history =
    JSON.parse(localStorage.getItem("moneyHistory")) || [];


  // Sätt dagens datum och aktuell tid automatiskt
  function setCurrentDateTime() {

    const now = new Date();

    const year = now.getFullYear();

    const month =
      String(now.getMonth() + 1).padStart(2, "0");

    const day =
      String(now.getDate()).padStart(2, "0");

    const hours =
      String(now.getHours()).padStart(2, "0");

    const minutes =
      String(now.getMinutes()).padStart(2, "0");

    document.getElementById("date").value =
      `${year}-${month}-${day}`;

    document.getElementById("time").value =
      `${hours}:${minutes}`;
  }


  function updateDisplay() {

    document.getElementById("saved").textContent =
      saved.toFixed(2);

    showHistory();
  }


  function getInput() {

    const amount =
      Number(document.getElementById("amount").value);

    const description =
      document.getElementById("description").value.trim();

    const date =
      document.getElementById("date").value;

    const time =
      document.getElementById("time").value;

    return {
      amount,
      description,
      date,
      time
    };
  }


  function clearInputs() {

    document.getElementById("amount").value = "";

    document.getElementById("description").value = "";

    setCurrentDateTime();
  }


  function saveMoney() {

    const {
      amount,
      description,
      date,
      time
    } = getInput();


    if (amount <= 0) {

      alert("Skriv ett belopp som är större än 0.");

      return;
    }


    if (description === "") {

      alert("Skriv vad du sparade pengarna på.");

      return;
    }


    if (!date || !time) {

      alert("Välj datum och tid.");

      return;
    }


    saved += amount;


    history.push({

      type: "Sparade",

      amount: amount,

      description: description,

      date: date,

      time: time

    });


    localStorage.setItem(
      "savedMoney",
      saved
    );


    localStorage.setItem(
      "moneyHistory",
      JSON.stringify(history)
    );


    clearInputs();

    updateDisplay();
  }


  function spendMoney() {

    const {
      amount,
      description,
      date,
      time
    } = getInput();


    if (amount <= 0) {

      alert("Skriv ett belopp som är större än 0.");

      return;
    }


    if (description === "") {

      alert("Skriv vad du slösade pengarna på.");

      return;
    }


    if (!date || !time) {

      alert("Välj datum och tid.");

      return;
    }


    if (amount > saved) {

      alert("Du har inte så mycket pengar sparade!");

      return;
    }


    saved -= amount;


    history.push({

      type: "Slösade",

      amount: amount,

      description: description,

      date: date,

      time: time

    });


    localStorage.setItem(
      "savedMoney",
      saved
    );


    localStorage.setItem(
      "moneyHistory",
      JSON.stringify(history)
    );


    clearInputs();

    updateDisplay();
  }


  function showHistory() {

    const historyElement =
      document.getElementById("history");


    if (history.length === 0) {

      historyElement.innerHTML =
        '<div class="empty">Ingen historik ännu 📭</div>';

      return;
    }


    historyElement.innerHTML = "";


    history.slice().reverse().forEach(item => {

      const row =
        document.createElement("div");


      const isSaved =
        item.type === "Sparade";


      row.className =
        "history-item " +
        (isSaved ? "saved" : "spent");


      const sign =
        isSaved ? "+" : "-";


      const emoji =
        isSaved ? "🟢" : "🔴";


      const textClass =
        isSaved ? "saved-text" : "spent-text";


      row.innerHTML = `

        <div class="history-top">

          <span>
            ${emoji} ${item.type}
          </span>

          <span class="${textClass}">
            ${sign}${Number(item.amount).toFixed(2)} kr
          </span>

        </div>

        <div class="description">
          ${escapeHTML(item.description)}
        </div>

        <div class="date">
          📅 ${formatDate(item.date)}
          &nbsp; 🕐 ${item.time}
        </div>

      `;


      historyElement.appendChild(row);

    });

  }


  function formatDate(date) {

    const parts = date.split("-");

    if (parts.length === 3) {

      return `${parts[2]}/${parts[1]}/${parts[0]}`;

    }

    return date;
  }


  function escapeHTML(text) {

    const div =
      document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
  }


  setCurrentDateTime();

  updateDisplay();

</script>

</body>
</html>
