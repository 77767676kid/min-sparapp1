<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min Sparapp</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f5f7;
            text-align: center;
            padding: 30px;
        }

        .app {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 10px;
        }

        .money {
            font-size: 40px;
            font-weight: bold;
            margin: 20px;
        }

        input {
            width: 80%;
            padding: 12px;
            margin: 8px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            padding: 12px 20px;
            margin: 8px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        .add {
            background: #4caf50;
            color: white;
        }

        .remove {
            background: #f44336;
            color: white;
        }

        .progress {
            background: #ddd;
            height: 20px;
            border-radius: 20px;
            overflow: hidden;
            margin: 15px 0;
        }

        .bar {
            height: 100%;
            width: 0%;
            background: #2196f3;
        }
    </style>
</head>

<body>

<div class="app">

    <h1>💰 Min Sparapp</h1>

    <p>Jag har sparat:</p>

    <div class="money">
        <span id="money">0</span> kr
    </div>

    <input id="amount" type="number" placeholder="Skriv belopp">

    <br>

    <button class="add" onclick="addMoney()">
        ➕ Lägg till
    </button>

    <button class="remove" onclick="removeMoney()">
        ➖ Ta bort
    </button>

    <hr>

    <h2>🎯 Mitt sparmål</h2>

    <input id="goal" type="number" placeholder="T.ex. 2000 kr">

    <p>
        <span id="percent">0</span>% sparat
    </p>

    <div class="progress">
        <div class="bar" id="bar"></div>
    </div>

</div>

<script>

let money = Number(localStorage.getItem("money")) || 0;
let goal = Number(localStorage.getItem("goal")) || 0;

function update() {

    document.getElementById("money").textContent = money;

    if (goal > 0) {

        let percent = Math.round((money / goal) * 100);

        if (percent > 100) {
            percent = 100;
        }

        document.getElementById("percent").textContent = percent;
        document.getElementById("bar").style.width = percent + "%";

    } else {

        document.getElementById("percent").textContent = 0;
        document.getElementById("bar").style.width = "0%";

    }

    localStorage.setItem("money", money);
    localStorage.setItem("goal", goal);
}

function addMoney() {

    let amount = Number(document.getElementById("amount").value);

    if (amount > 0) {
        money += amount;
        document.getElementById("amount").value = "";
        update();
    }
}

function removeMoney() {

    let amount = Number(document.getElementById("amount").value);

    if (amount > 0) {
        money -= amount;

        if (money < 0) {
            money = 0;
        }

        document.getElementById("amount").value = "";
        update();
    }
}

document.getElementById("goal").addEventListener("input", function() {

    goal = Number(this.value);
    update();

});

update();

</script>

</body>
</html>
